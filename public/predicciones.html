<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predicciones bajo la lupa</title>
<meta name="description" content="Seguimiento diario de sitios que dicen predecir numeros calientes de Nuevos Tiempos, comparado contra la probabilidad esperada por puro azar.">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="wrap">
  <h1>Predicciones bajo la lupa</h1>
  <p class="tagline">Sitios que dicen saber que numero esta "caliente", puestos a prueba contra el azar. Se captura cada manana y se califica cada noche, solo.</p>
  <nav class="tabs">
    <a href="index.html">Analisis</a>
    <a href="predicciones.html" class="active">Predicciones bajo la lupa</a>
  </nav>

  <div id="draws-today"><p class="loading">Cargando sorteos de hoy...</p></div>
  <div id="shortlist"></div>
  <div id="today"><p class="loading">Cargando predicciones de hoy...</p></div>
  <div id="summary"></div>
  <div id="history"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getFirestore, doc, onSnapshot, collection, query, where, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = await fetch('/__/firebase/init.json').then(r => r.json());
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const SLOTS = ['Mediodia', 'Tarde', 'Noche'];
const MAX_CHIPS_INLINE = 10; // listas mas largas que esto se muestran colapsadas

function todayCR() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Costa_Rica', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}

// shortlistSet (opcional): numeros que cumplen nuestro propio criterio
// ("atrasado" + predicho por alguna fuente) -- se marcan con ⭐ ademas
// del color, para no depender solo del color para distinguirlos.
function chips(numbers, matchedNum, shortlistSet) {
  return numbers.map(n => {
    const isMatch = n === matchedNum;
    const isShort = !isMatch && shortlistSet && shortlistSet.has(n);
    const cls = isMatch ? ' match' : (isShort ? ' shortlist' : '');
    const label = isShort ? `⭐${n}` : n;
    return `<span class="num-chip${cls}"${isShort ? ` title="tambien esta en Numeros a seguir hoy"` : ''}>${label}</span>`;
  }).join('');
}

// Igual que chips(), pero si la lista es larga (ej. los 30 calientes) la
// esconde detras de un <details> para no llenar la pantalla de numeros.
function chipsMaybeCollapsed(numbers, matchedNum, shortlistSet) {
  const body = `<div class="numbers-list">${chips(numbers, matchedNum, shortlistSet)}</div>`;
  if (numbers.length <= MAX_CHIPS_INLINE) return body;
  return `<details><summary>Ver los ${numbers.length} numeros</summary>${body}</details>`;
}

// Version compacta para filas de tabla: muestra unos pocos y resume el resto.
function chipsCompactForRow(numbers, matchedNum) {
  const shown = numbers.slice(0, MAX_CHIPS_INLINE);
  const extra = numbers.length - shown.length;
  return `<div class="numbers-list">${chips(shown, matchedNum)}${extra > 0 ? `<span class="note" style="display:inline;">+${extra} mas</span>` : ''}</div>`;
}

function pillFor(hit) {
  if (hit === null || hit === undefined) return '<span class="pill pending">pendiente</span>';
  return hit ? '<span class="pill hit">acerto</span>' : '<span class="pill miss">no acerto</span>';
}

// El numero ganador que aparece dentro de matched_draw, ej. "Tarde 62" -> "62"
function matchedNumberFrom(matchedDraw) {
  if (!matchedDraw) return null;
  const m = matchedDraw.match(/(\d{1,2})\s*$/);
  return m ? m[1].padStart(2, '0') : null;
}

let latestStats = null;
let latestPredictions = null;

// Numeros que cumplen las dos señales (atrasado en nuestro historico +
// predicho hoy por alguna fuente externa). Se usa tanto para la tarjeta
// "Numeros a seguir hoy" como para marcar con ⭐ esos mismos numeros
// dentro de las listas crudas de "Predicciones de hoy".
function computeShortlist() {
  if (!latestStats || !Array.isArray(latestStats.overdue) || !latestStats.overdue.length) return [];
  const overdueMap = new Map(latestStats.overdue.map(o => [String(o.num).padStart(2, '0'), o.draws_since]));

  const predictedSet = new Set();
  if (latestPredictions && latestPredictions.length) {
    for (const r of latestPredictions) {
      for (const raw of r.numbers) predictedSet.add(String(raw).padStart(2, '0'));
    }
  }

  return [...overdueMap.entries()]
    .filter(([num]) => predictedSet.has(num))
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);
}

// --- Sorteos de hoy: se actualiza solo en vivo a medida que van saliendo ---
const dateToday = todayCR();
onSnapshot(query(collection(db, 'draws'), where('date', '==', dateToday)), (snap) => {
  const el = document.getElementById('draws-today');
  const bySlot = {};
  snap.docs.forEach(d => { const r = d.data(); bySlot[r.slot] = r; });

  el.innerHTML = `
    <div class="card">
      <h2>Sorteos de hoy (${dateToday})</h2>
      <div class="grid">
        ${SLOTS.map(slot => {
          const r = bySlot[slot];
          return `
            <div class="stat">
              <div class="label">${slot}</div>
              <div class="value">${r ? r.numero + (r.reventado ? ' 🔴' : '') : '—'}</div>
              <p class="note" style="margin-top:6px;">${r ? 'ya salio' : 'aun no sale'}</p>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
});

// --- Predicciones de hoy + Lista corta: se re-renderizan juntas cada vez
// que cambia cualquiera de las dos fuentes (predictions o stats/latest),
// para que las ⭐ en las listas crudas y la tarjeta resumen nunca queden
// desincronizadas entre si.
onSnapshot(query(collection(db, 'predictions'), where('date', '==', dateToday)), (snap) => {
  latestPredictions = snap.empty ? [] : snap.docs.map(d => d.data());
  renderTodayAndShortlist();
});

onSnapshot(doc(db, 'stats', 'latest'), (snap) => {
  latestStats = snap.exists() ? snap.data() : null;
  renderTodayAndShortlist();
});

function renderTodayAndShortlist() {
  renderToday();
  renderShortlist();
}

function renderToday() {
  const el = document.getElementById('today');
  if (latestPredictions === null) return; // aun no llega el primer snapshot
  if (latestPredictions.length === 0) {
    el.innerHTML = '<div class="card"><h2>Predicciones de hoy</h2><p class="note">Aun no se ha capturado la prediccion de hoy (llega en la manana, hora Costa Rica).</p></div>';
    return;
  }
  const shortlistSet = new Set(computeShortlist().map(([num]) => num));
  el.innerHTML = `
    <div class="card">
      <h2>Predicciones de hoy</h2>
      ${shortlistSet.size ? `<p class="note" style="margin-bottom:10px;">⭐ = tambien esta atrasado en nuestro historico (ver "Numeros a seguir hoy" abajo).</p>` : ''}
      ${latestPredictions.map(r => {
        const matchedNum = matchedNumberFrom(r.matched_draw);
        return `
        <div style="margin-bottom:14px;">
          <p class="note" style="margin-bottom:6px;"><strong>${r.kind}</strong> · baseline por azar: ${r.baseline_pct}% &nbsp; ${pillFor(r.hit)}${matchedNum ? ` <span class="note" style="display:inline">(coincidio con ${r.matched_draw})</span>` : ''}</p>
          ${chipsMaybeCollapsed(r.numbers, matchedNum, shortlistSet)}
        </div>
      `;}).join('')}
    </div>
  `;
}

// --- Numeros a seguir hoy: numeros que estan a la vez "atrasados" en
// nuestro propio historico Y predichos hoy por alguna fuente externa.
// Es la primera tarjeta despues de los sorteos de hoy porque es el
// resumen mas accionable -- el resto de la pagina es detalle/auditoria.
function renderShortlist() {
  const el = document.getElementById('shortlist');
  if (!latestStats) { el.innerHTML = ''; return; }

  const ranked = computeShortlist();

  if (ranked.length === 0) {
    el.innerHTML = `
      <div class="card">
        <h2>Numeros a seguir hoy</h2>
        <p class="note">Hoy ningun numero esta a la vez atrasado en nuestro historico y predicho por yelu.cr. Sin cruce, no hay lista corta que mostrar.</p>
      </div>
    `;
    return;
  }

  el.innerHTML = `
    <div class="card">
      <h2>Numeros a seguir hoy</h2>
      <p class="note">⭐ Cumplen las dos cosas: llevan mas sorteos sin salir en nuestro historico, y ademas yelu.cr los predice hoy. Estas mismas ⭐ aparecen marcadas en "Predicciones de hoy" abajo. No cambia la probabilidad real de cada numero -- es solo para no revisar 30 numeros sueltos.</p>
      <div class="numbers-list">
        ${ranked.map(([num, draws_since]) => `<span class="num-chip shortlist" title="atrasado: ${draws_since} sorteos sin salir">⭐${num}</span>`).join('')}
      </div>
    </div>
  `;
}

onSnapshot(doc(db, 'predictions_summary', 'latest'), (snap) => {
  const el = document.getElementById('summary');
  if (!snap.exists()) { el.innerHTML = ''; return; }
  const s = snap.data();
  const rows = Object.entries(s.sources);
  el.innerHTML = `
    <div class="card">
      <h2>Historial de aciertos por fuente</h2>
      <table>
        <thead><tr><th>Fuente</th><th>Tipo</th><th class="mono">Dias</th><th class="mono">Acierto real</th><th class="mono">Esperado por azar</th></tr></thead>
        <tbody>
          ${rows.map(([source, v]) => `
            <tr>
              <td>${source}</td>
              <td>${v.kind}</td>
              <td class="mono">${v.days}</td>
              <td class="mono">${v.hit_rate_pct}%</td>
              <td class="mono">${v.baseline_pct}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <p class="note">Si "acierto real" se mantiene cerca de "esperado por azar" con el paso de los dias, esa fuente no esta prediciendo mejor que tirar un dado. Actualizado: ${new Date(s.updated_at).toLocaleString('es-CR')}</p>
    </div>
  `;
});

// --- Ultimos registros: ahora muestra tambien QUE numeros predijo cada
// fuente ese dia (antes solo se veia si acerto o no, sin poder revisar
// que habian dicho cuando fallaban).
onSnapshot(query(collection(db, 'predictions'), orderBy('date', 'desc'), limit(30)), (snap) => {
  const el = document.getElementById('history');
  if (snap.empty) { el.innerHTML = ''; return; }
  const rows = snap.docs.map(d => d.data());
  el.innerHTML = `
    <div class="card">
      <h2>Ultimos 30 registros</h2>
      <table>
        <thead><tr><th>Fecha</th><th>Fuente</th><th>Predijo</th><th>Resultado</th><th>Sorteo</th></tr></thead>
        <tbody>
          ${rows.map(r => {
            const matchedNum = matchedNumberFrom(r.matched_draw);
            return `
            <tr>
              <td class="mono">${r.date}</td>
              <td>${r.source}</td>
              <td>${chipsCompactForRow(r.numbers || [], matchedNum)}</td>
              <td>${pillFor(r.hit)}</td>
              <td class="mono">${r.matched_draw || '-'}</td>
            </tr>
          `;}).join('')}
        </tbody>
      </table>
    </div>
  `;
});
</script>
</body>
</html>
